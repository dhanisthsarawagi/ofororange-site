<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O for Orange — Surat</title>
<meta name="description" content="O for Orange — food and coffee in Surat.">
<meta property="og:title" content="O for Orange">
<meta property="og:description" content="Food and coffee in Surat.">
<style>
:root{--o:#ff6a00;--ink:#1a1209;--bg:#fff8f0}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{max-width:34rem}
.logo{width:96px;height:96px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:3rem;font-weight:800;margin:0 auto 28px;box-shadow:0 12px 30px -10px var(--o)}
h1{font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:-.02em;line-height:1.05}
h1 span{color:var(--o)}
p{margin-top:16px;font-size:1.15rem;line-height:1.5;color:#5a4a38}
.pill{display:inline-block;margin-top:28px;padding:10px 20px;border:2px solid var(--o);border-radius:999px;color:var(--o);font-weight:600}
@media (prefers-color-scheme:dark){:root{--ink:#fff3e6;--bg:#16100a}p{color:#cdb9a3}}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">O</div>
<h1><span>O</span> for Orange</h1>
<p>Good food and great coffee, made fresh in Surat.</p>
<span class="pill">Surat, Gujarat</span>
</main>
</body>
</html>
